name: React Shorts Auto Pipeline (6x/Dia)

on:
  schedule:
    # 09h, 11h, 13h, 15h, 17h e 19h (Horário de Brasília / UTC-3)
    - cron: '0 12,14,16,18,20,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ReactFactory/requirements.txt

      - name: Run React Shorts Pipeline (Cloud Autonomous)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          python ReactFactory/main_pipeline.py --upload

      - name: Save Video History to Repository
        run: |
          git config user.name "ReactFactory Bot"
          git config user.email "bot@reactfactory.local"
          git add ReactFactory/data/history.json
          git diff --staged --quiet || (git commit -m "chore: update posted viral videos history [skip ci]" && git push)
