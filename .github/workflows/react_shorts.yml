name: React Shorts Auto Pipeline (6x/Dia)

on:
  # Cron nativo do GitHub pausado (evita atraso de 8h e disparos duplicados quando usar Google Apps Script)
  # schedule:
  #   - cron: '0 12,14,16,18,20,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts & FFmpeg & Deno
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ReactFactory/requirements.txt
          pip install -U "yt-dlp[default]"

      - name: Run React Shorts Pipeline (Cloud Autonomous)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          YOUTUBE_TOKEN_2_BASE64: ${{ secrets.YOUTUBE_TOKEN_2_BASE64 }}
          YOUTUBE_TOKEN_3_BASE64: ${{ secrets.YOUTUBE_TOKEN_3_BASE64 }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python -u ReactFactory/main_pipeline.py --upload

      - name: Save Video History to Repository
        run: |
          git config user.name "ReactFactory Bot"
          git config user.email "bot@reactfactory.local"
          python ReactFactory/merge_history.py
