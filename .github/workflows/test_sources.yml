name: Test Sources Cloud
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp + curl_cffi + deno
        run: |
          pip install -q "yt-dlp[default,curl-cffi]"
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: Probe TikTok & YouTube
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python - << 'PY'
import os, base64, yt_dlp
print('--- TEST 1: TIKTOK USER (@manualdomundo) ---')
try:
    with yt_dlp.YoutubeDL({'quiet': False, 'extract_flat': 'in_playlist', 'playlistend': 3}) as ydl:
        r = ydl.extract_info('https://www.tiktok.com/@manualdomundo', download=False)
        es = (r or {}).get('entries') or []
        print('TIKTOK ENTRIES:', len(es), [e.get('url') or e.get('id') for e in es[:3]])
        if es:
            u = es[0].get('url') or es[0].get('webpage_url')
            with yt_dlp.YoutubeDL({'quiet': False, 'outtmpl': '/tmp/tt.%(ext)s'}) as ydl2:
                ydl2.download([u])
            print('TIKTOK DOWNLOAD OK!')
except Exception as e:
    print('TIKTOK ERR:', e)

print('--- TEST 2: YOUTUBE WITH COOKIES + DENO + PERMISSIVE FORMAT ---')
b64 = os.environ.get('YOUTUBE_COOKIES_B64', '')
with open('/tmp/ck.txt', 'w') as f:
    f.write(base64.b64decode(b64).decode('utf-8', 'replace'))
for vid in ['8dsdbTKbpnY', 'go_6oIh7MKE']:
    try:
        with yt_dlp.YoutubeDL({'quiet': False, 'cookiefile': '/tmp/ck.txt', 'format': 'bv*+ba/b', 'outtmpl': f'/tmp/{vid}.%(ext)s'}) as ydl:
            ydl.download([f'https://www.youtube.com/watch?v={vid}'])
        print('YT DOWNLOAD OK:', vid)
    except Exception as e:
        print('YT ERR:', vid, e)
PY
