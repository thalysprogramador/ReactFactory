name: GTA 6 Pro Long Video (2x/Dia)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-and-upload-long:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20 for Remotion Studio
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Fonts, FFmpeg, Chromium Deps & Deno
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation unzip libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation unzip libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          cd ReactFactory/studio && npm install --no-audit --no-fund

      - name: Start YouTube PO Token Server (bgutil Docker)
        run: |
          docker run -d --name bgutil-pot -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider || true
          for i in {1..15}; do curl -sf http://127.0.0.1:4416/ping >/dev/null && break || sleep 2; done

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ReactFactory/requirements.txt
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Run GTA 6 Storytelling Long Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          YOUTUBE_TOKEN_2_BASE64: ${{ secrets.YOUTUBE_TOKEN_2_BASE64 }}
          YOUTUBE_TOKEN_3_BASE64: ${{ secrets.YOUTUBE_TOKEN_3_BASE64 }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python -u ReactFactory/gta6_long_pipeline.py --upload

      - name: Save GTA 6 Long History to Repository
        run: |
          git config user.name "ReactFactory Bot"
          git config user.email "bot@reactfactory.local"
          python ReactFactory/merge_history.py
